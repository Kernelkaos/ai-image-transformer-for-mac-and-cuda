name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install linter
        run: pip install ruff pyyaml
      - name: Lint
        run: ruff check .
      - name: Check syntax
        run: python -m compileall -q app.py src
      - name: Validate config
        run: python -c "import yaml; yaml.safe_load(open('config/settings.yaml'))"
