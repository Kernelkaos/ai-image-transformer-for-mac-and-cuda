name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `python app.py`
        2. Upload an image
        3. Click "Transform Image"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options: [NVIDIA GPU (CUDA), Apple Silicon (MPS), CPU]
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26.6, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Paste the full error message.
      render: shell
