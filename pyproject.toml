[project]
name = "ai-image-transformer"
version = "1.0.0"
description = "Local web app that transforms images with Stable Diffusion XL and ControlNet Canny."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.14"
authors = [{ name = "Kernelkaos" }]
keywords = ["stable-diffusion", "sdxl", "controlnet", "gradio", "image-to-image"]

[project.urls]
Homepage = "https://github.com/Kernelkaos/ai-image-transformer-for-mac-and-cuda"
Issues = "https://github.com/Kernelkaos/ai-image-transformer-for-mac-and-cuda/issues"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
